<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>3D Calculator</title>
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0;
    display: flex;
    justify-content: center;
    align-items: center;
    height: 100vh;
    background: linear-gradient(135deg, #667eea, #764ba2);
    font-family: Arial, sans-serif;
  }

  .calculator {
    width: 340px;
    background: #1c1c1c;
    border-radius: 25px;
    padding: 20px;
    box-shadow: 0 15px 40px rgba(0,0,0,0.5);
  }

  .display {
    width: 100%;
    height: 60px;
    font-size: 2rem;
    text-align: right;
    border: none;
    padding: 10px 15px;
    margin-bottom: 15px;
    background: linear-gradient(145deg, #2c2c2c, #1c1c1c);
    color: #fff;
    border-radius: 15px;
    box-shadow: inset 0 4px 10px rgba(0,0,0,0.5);
  }

  .buttons {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    grid-template-rows: repeat(5, 60px);
    gap: 8px;
  }

  button {
    width: 100%;
    height: 100%;
    font-size: 1.5rem;
    border: none;
    border-radius: 12px;
    cursor: pointer;
    background: linear-gradient(145deg, #3c3c3c, #2c2c2c);
    color: #fff;
    box-shadow: 0 4px 8px rgba(0,0,0,0.5);
    transition: all 0.2s ease;
  }

  button:hover {
    transform: translateY(-3px);
    box-shadow: 0 8px 16px rgba(0,0,0,0.7);
    background: linear-gradient(145deg, #4c4c4c, #3c3c3c);
  }

  button:active {
    transform: translateY(0);
    box-shadow: 0 4px 8px rgba(0,0,0,0.5);
  }

  .operator {
    background: #ff9500;
  }

  .operator:hover {
    background: #e08a00;
  }

  .equal {
    background: #4caf50;
    grid-row: 4 / 6; /* spans 2 rows */
  }

  .equal:hover {
    background: #43a047;
  }

  .zero {
    grid-column: span 2;
  }

  @media(max-width: 400px){
    .calculator { width: 90%; padding: 15px; }
    .display { height: 50px; font-size: 1.8rem; }
    .buttons { grid-template-rows: repeat(5, 50px); gap: 6px; }
    button { font-size: 1.3rem; }
  }
</style>
</head>
<body>

<div class="calculator">
  <input type="text" class="display" id="display" disabled placeholder="0">
  <div class="buttons">
    <!-- Top row: C, ⌫, ÷, × -->
    <button onclick="clearDisplay()" class="operator">C</button>
    <button onclick="deleteLast()" class="operator">⌫</button>
    <button onclick="appendOperator('/')" class="operator">÷</button>
    <button onclick="appendOperator('*')" class="operator">×</button>

    <!-- Numbers 7 8 9 - -->
    <button onclick="appendNumber('7')">7</button>
    <button onclick="appendNumber('8')">8</button>
    <button onclick="appendNumber('9')">9</button>
    <button onclick="appendOperator('-')" class="operator">−</button>

    <!-- Numbers 4 5 6 + -->
    <button onclick="appendNumber('4')">4</button>
    <button onclick="appendNumber('5')">5</button>
    <button onclick="appendNumber('6')">6</button>
    <button onclick="appendOperator('+')" class="operator">+</button>

    <!-- Numbers 1 2 3 = -->
    <button onclick="appendNumber('1')">1</button>
    <button onclick="appendNumber('2')">2</button>
    <button onclick="appendNumber('3')">3</button>
    <button onclick="calculateResult()" class="equal">=</button>

    <!-- Bottom row 0 . -->
    <button onclick="appendNumber('0')" class="zero">0</button>
    <button onclick="appendNumber('.')">.</button>
  </div>
</div>

<script>
  const display = document.getElementById('display');
  let currentInput = "";
  let resultCalculated = false;

  function appendNumber(number) {
    if (resultCalculated) { currentInput = ""; resultCalculated = false; }
    const lastNumber = currentInput.split(/[\+\-\*\/]/).pop();
    if (number === "." && lastNumber.includes(".")) return;
    currentInput += number;
    updateDisplay();
  }

  function appendOperator(operator) {
    if (currentInput === "") return;
    const lastChar = currentInput.slice(-1);
    if (["+", "-", "*", "/"].includes(lastChar)) {
      currentInput = currentInput.slice(0, -1) + operator;
    } else {
      currentInput += operator;
    }
    resultCalculated = false;
    updateDisplay();
  }

  function clearDisplay() { currentInput = ""; updateDisplay(); }
  function deleteLast() { currentInput = currentInput.slice(0, -1); updateDisplay(); }
  function calculateResult() {
    if (currentInput === "") return;
    try { currentInput = eval(currentInput).toString(); resultCalculated = true; updateDisplay(); }
    catch { currentInput = "Error"; updateDisplay(); currentInput = ""; }
  }
  function updateDisplay() { display.value = currentInput || "0"; }
</script>

</body>
</html>
